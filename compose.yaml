services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: chapter
      POSTGRES_USER: chapter
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-chapter-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["chapter-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chapter -d chapter"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/chapter
      DATABASE_USERNAME: chapter
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-chapter-local-only}
      DEMO_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
volumes:
  chapter-data:
