server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chapter}
    username: ${DATABASE_USERNAME:chapter}
    password: ${DATABASE_PASSWORD:chapter-local-only}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
library:
  demo: ${DEMO_ENABLED:true}
  reset-on-start: ${DEMO_RESET_ON_START:false}
  demo-password: ${DEMO_PASSWORD:chapter-demo}
